asyncapi: 3.0.0
info:
  title: Ledger Posting Outcome Events
  version: 1.0.0
  description: >-
    Versioned ledger-owned facts published after a ledger posting reaches a
    terminal outcome. Ledger Service is the only producer. Account Service
    settles the reservation and account projection idempotently, while
    Transaction Service owns transfer status and saga state. Consumers must
    process each event idempotently. The internal HTTP posting and reversal
    commands require X-Correlation-Id and X-Causation-Id headers. Their
    inbound adapters map both headers to PostLedgerEntryCommand or
    PostLedgerReversalCommand, and the application service propagates them
    unchanged to the ledger outbox record.
defaultContentType: application/json
x-data-classification: confidential-financial
x-schema-registry:
  boundary: AsyncAPI payload schemas are the organization contract; the Schema Registry stores the registered serialized schemas and enforces compatibility.
  subjectStrategy: TopicNameStrategy
  subjects:
    ledger.posting.completed.v1: ledger.posting.completed.v1-value
    ledger.posting.failed.v1: ledger.posting.failed.v1-value
  compatibility: BACKWARD_TRANSITIVE
  provisioning: Platform infrastructure owns registry subjects and Kafka topic provisioning. This document contains no registry URL, credential, or schema id.
channels:
  ledger.posting.completed.v1:
    address: ledger.posting.completed.v1
    description: >-
      Ledger Service publishes this fact after the balanced, immutable posting
      and its outbox row are durable. Account Service consumes it to commit
      the debit reservation and apply credit or reversal projections.
      Transaction Service consumes it to advance the transfer saga. The Kafka
      partition key is aggregateId; ordering is guaranteed only per key on
      this topic, not across the completion and failure topics.
    x-producer: ledger-service
    x-consumers:
      - account-service
      - transaction-service
    x-partition-key: aggregateId
    x-delivery-semantics: at-least-once; consumers use an inbox keyed by eventId.
    x-dead-letter-topic: ledger.posting.completed.v1.dlq
    x-dead-letter-policy: >-
      Retry transient consumer failures with bounded backoff. After the attempt
      limit, preserve the original event and failure metadata in this
      topic-specific DLQ or quarantine topic. Replay is explicit, authorized,
      and idempotent; a DLQ record is never a new business fact.
    messages:
      ledgerPostingCompleted:
        $ref: '#/components/messages/LedgerPostingCompletedV1'
    bindings:
      kafka:
        topic: ledger.posting.completed.v1
        bindingVersion: 0.5.0
  ledger.posting.failed.v1:
    address: ledger.posting.failed.v1
    description: >-
      Ledger Service publishes this fact for a durably classified terminal
      business failure. Account Service consumes it to release the related
      reservation. Transaction Service consumes it to fail the transfer saga.
      Transient persistence or broker failures are retried and are not
      represented as business failure facts. The Kafka partition key is
      aggregateId; ordering is guaranteed only per key on this topic, not
      across the completion and failure topics.
    x-producer: ledger-service
    x-consumers:
      - account-service
      - transaction-service
    x-partition-key: aggregateId
    x-delivery-semantics: at-least-once; consumers use an inbox keyed by eventId.
    x-dead-letter-topic: ledger.posting.failed.v1.dlq
    x-dead-letter-policy: >-
      Retry transient consumer failures with bounded backoff. After the attempt
      limit, preserve the original event and failure metadata in this
      topic-specific DLQ or quarantine topic. Replay is explicit, authorized,
      and idempotent; a DLQ record is never a new business fact.
    messages:
      ledgerPostingFailed:
        $ref: '#/components/messages/LedgerPostingFailedV1'
    bindings:
      kafka:
        topic: ledger.posting.failed.v1
        bindingVersion: 0.5.0
operations:
  publishLedgerPostingCompleted:
    action: send
    description: Ledger Service publishes a durable completion fact; it does not orchestrate the transfer saga.
    channel:
      $ref: '#/channels/ledger.posting.completed.v1'
    messages:
      - $ref: '#/channels/ledger.posting.completed.v1/messages/ledgerPostingCompleted'
  publishLedgerPostingFailed:
    action: send
    description: Ledger Service publishes a durable terminal business-failure fact; it does not mutate account balances or transfer state.
    channel:
      $ref: '#/channels/ledger.posting.failed.v1'
    messages:
      - $ref: '#/channels/ledger.posting.failed.v1/messages/ledgerPostingFailed'
components:
  messages:
    LedgerPostingCompletedV1:
      name: LedgerPostingCompleted.v1
      title: Ledger posting completed
      summary: Immutable ledger posting completed successfully.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LedgerPostingCompletedV1'
      headers:
        $ref: '#/components/schemas/LedgerEventHeaders'
      examples:
        - name: multiLinePosting
          summary: Completed posting with one debit and two credit lines.
          payload:
            eventId: 'fbd2e85a-bc91-4dc0-a1b3-9509d0d6c241'
            eventType: LedgerPostingCompleted.v1
            schemaVersion: 1.0.0
            producer: ledger-service
            occurredAt: '2026-08-30T08:15:30Z'
            aggregateId: 'dd480939-2dde-49b7-aa22-c8f22a7789ad'
            correlationId: 'transfer-58e271cd'
            causationId: 'command-63ca8eb6'
            transactionId: 'transfer-58e271cd'
            reservationRequestId: 'reservation-58e271cd'
            postingId: 'dd480939-2dde-49b7-aa22-c8f22a7789ad'
            postingRequestId: 'posting-request-4d93c803'
            currency: USD
            lines:
              - accountId: 'f5aa4b14-6616-4c84-b0d5-3f178cb50864'
                lineType: DEBIT
                amount: '125.5000'
              - accountId: '68bc664d-75f7-46b7-82bf-659e733eb653'
                lineType: CREDIT
                amount: '100.0000'
              - accountId: 'db49e9df-89ee-43f4-9db5-483a69f7dd63'
                lineType: CREDIT
                amount: '25.5000'
        - name: reversalPosting
          summary: Completed posting that reverses an earlier immutable ledger entry.
          payload:
            eventId: 'ce6c3f8f-3123-4d10-a6e6-53a3d351b5b8'
            eventType: LedgerPostingCompleted.v1
            schemaVersion: 1.0.0
            producer: ledger-service
            occurredAt: '2026-08-30T08:17:02Z'
            aggregateId: '13dc863f-30f4-4ed4-b9a6-3035d310d7ae'
            correlationId: 'transfer-58e271cd'
            causationId: 'command-2a794f84'
            transactionId: 'transfer-58e271cd'
            reservationRequestId: 'reservation-58e271cd'
            postingId: '13dc863f-30f4-4ed4-b9a6-3035d310d7ae'
            postingRequestId: 'posting-request-8ebae790'
            reversalOfLedgerEntryId: 'dd480939-2dde-49b7-aa22-c8f22a7789ad'
            currency: USD
            lines:
              - accountId: '68bc664d-75f7-46b7-82bf-659e733eb653'
                lineType: DEBIT
                amount: '125.5000'
              - accountId: 'f5aa4b14-6616-4c84-b0d5-3f178cb50864'
                lineType: CREDIT
                amount: '125.5000'
      bindings:
        kafka:
          bindingVersion: 0.5.0
    LedgerPostingFailedV1:
      name: LedgerPostingFailed.v1
      title: Ledger posting failed
      summary: Requested ledger posting could not be completed.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LedgerPostingFailedV1'
      headers:
        $ref: '#/components/schemas/LedgerEventHeaders'
      examples:
        - name: rejectedPosting
          summary: Posting rejected because the requested lines are invalid.
          payload:
            eventId: '3b814775-7756-456d-87ed-fbf7be2a5868'
            eventType: LedgerPostingFailed.v1
            schemaVersion: 1.0.0
            producer: ledger-service
            occurredAt: '2026-08-30T08:16:14Z'
            aggregateId: 'posting-request-4d93c803'
            correlationId: 'transfer-58e271cd'
            causationId: 'command-63ca8eb6'
            transactionId: 'transfer-58e271cd'
            reservationRequestId: 'reservation-58e271cd'
            postingRequestId: 'posting-request-4d93c803'
            failureCode: VALIDATION_ERROR
            failureReason: 'Posting lines must contain at least one debit and one credit.'
      bindings:
        kafka:
          bindingVersion: 0.5.0
  schemas:
    LedgerEventHeaders:
      type: object
      description: >-
        Required Kafka headers. Header names use kebab-case on the wire; the
        payload repeats the same identity and timing facts in camelCase for
        consumers that persist or replay the event body.
      additionalProperties: false
      required:
        - event-id
        - correlation-id
        - causation-id
        - producer
        - schema-version
        - occurred-at
      properties:
        event-id:
          type: string
          format: uuid
          description: Stable event identifier reused for every delivery retry.
        correlation-id:
          type: string
          minLength: 1
          description: End-to-end workflow correlation identifier.
        causation-id:
          type: string
          minLength: 1
          description: Command or preceding event that caused this event.
        producer:
          type: string
          const: ledger-service
          description: Canonical service name of the producer.
        schema-version:
          type: string
          const: 1.0.0
          description: Registered payload schema version.
        occurred-at:
          type: string
          format: date-time
          description: UTC event occurrence timestamp.
    LedgerPostingCompletedV1:
      type: object
      additionalProperties: true
      required:
        - eventId
        - eventType
        - schemaVersion
        - producer
        - occurredAt
        - aggregateId
        - correlationId
        - causationId
        - transactionId
        - reservationRequestId
        - postingId
        - postingRequestId
        - currency
        - lines
      properties:
        eventId:
          type: string
          format: uuid
          description: Unique immutable identifier for this event instance.
        eventType:
          type: string
          const: LedgerPostingCompleted.v1
          description: Versioned event name.
        schemaVersion:
          type: string
          const: 1.0.0
          description: Semantic version of the registered payload schema; compatible additive changes may increment the minor or patch component within v1.
        producer:
          type: string
          const: ledger-service
          description: Canonical service name of the sole producer.
        occurredAt:
          type: string
          format: date-time
          description: UTC timestamp at which the posting outcome occurred.
        aggregateId:
          type: string
          format: uuid
          description: Ledger posting aggregate identifier; equal to postingId for this event.
        correlationId:
          type: string
          minLength: 1
          description: Identifier propagated from the initiating command or event across the transfer workflow.
        causationId:
          type: string
          minLength: 1
          description: Identifier propagated from the command or event that caused this outcome.
        transactionId:
          type: string
          minLength: 1
          description: Transfer identifier owned by Transaction Service and shared across the transfer saga.
        reservationRequestId:
          type: string
          minLength: 1
          description: Account Service reservation request identifier to settle or release idempotently.
        postingId:
          type: string
          format: uuid
          description: Immutable ledger posting identifier.
        postingRequestId:
          type: string
          minLength: 1
          description: Idempotency key supplied with the posting request.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 currency code.
        reversalOfLedgerEntryId:
          type: string
          format: uuid
          description: Optional immutable ledger entry identifier that this posting reverses.
        lines:
          type: array
          minItems: 2
          description: Immutable debit and credit lines that make up the balanced posting.
          allOf:
            - contains:
                type: object
                required:
                  - lineType
                properties:
                  lineType:
                    const: DEBIT
            - contains:
                type: object
                required:
                  - lineType
                properties:
                  lineType:
                    const: CREDIT
          items:
            $ref: '#/components/schemas/LedgerPostingLine'
    LedgerPostingFailedV1:
      type: object
      additionalProperties: true
      required:
        - eventId
        - eventType
        - schemaVersion
        - producer
        - occurredAt
        - aggregateId
        - correlationId
        - causationId
        - transactionId
        - reservationRequestId
        - postingRequestId
        - failureCode
        - failureReason
      properties:
        eventId:
          type: string
          format: uuid
          description: Unique immutable identifier for this event instance.
        eventType:
          type: string
          const: LedgerPostingFailed.v1
          description: Versioned event name.
        schemaVersion:
          type: string
          const: 1.0.0
          description: Semantic version of the registered payload schema; compatible additive changes may increment the minor or patch component within v1.
        producer:
          type: string
          const: ledger-service
          description: Canonical service name of the sole producer.
        occurredAt:
          type: string
          format: date-time
          description: UTC timestamp at which the posting outcome occurred.
        aggregateId:
          type: string
          minLength: 1
          description: Posting request identifier because no completed posting aggregate exists.
        correlationId:
          type: string
          minLength: 1
          description: Identifier propagated from the initiating command or event across the transfer workflow.
        causationId:
          type: string
          minLength: 1
          description: Identifier propagated from the command or event that caused this outcome.
        transactionId:
          type: string
          minLength: 1
          description: Transfer identifier owned by Transaction Service and shared across the transfer saga.
        reservationRequestId:
          type: string
          minLength: 1
          description: Account Service reservation request identifier to settle or release idempotently.
        postingRequestId:
          type: string
          minLength: 1
          description: Idempotency key supplied with the posting request.
        failureCode:
          type: string
          enum:
            - VALIDATION_ERROR
            - CONFLICT
            - ACCOUNTING_ERROR
            - INTERNAL_ERROR
          description: Stable, machine-readable classification of the posting failure.
        failureReason:
          type: string
          minLength: 1
          maxLength: 500
          description: Sanitized human-readable detail that must not expose secrets or internal implementation data.
    LedgerPostingLine:
      type: object
      required:
        - accountId
        - lineType
        - amount
      properties:
        accountId:
          type: string
          format: uuid
          description: Opaque account identifier for this ledger line; never place account numbers or customer PII here.
        lineType:
          type: string
          enum:
            - DEBIT
            - CREDIT
          description: Direction of the ledger line.
        amount:
          $ref: '#/components/schemas/PositiveDecimalAmount'
    PositiveDecimalAmount:
      type: string
      pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]{1,4})?$'
      not:
        enum:
          - '0'
          - '0.0'
          - '0.00'
          - '0.000'
          - '0.0000'
      description: Decimal amount encoded as a string. It must be at least 0.0001 and have no more than four fractional digits.
