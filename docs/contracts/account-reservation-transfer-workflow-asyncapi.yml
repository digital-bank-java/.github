  schemas:
    WorkflowMessageHeaders:
      type: object
      description: >-
        Required Kafka headers aligned with the ledger contract in .github PR
        #137. Header names use kebab-case on the wire. The payload repeats the
        same identity and timing facts in camelCase for persistence and replay.
        Header values must equal their payload counterparts.
      additionalProperties: false
      required:
        - event-id
        - correlation-id
        - causation-id
        - producer
        - schema-version
        - occurred-at
      properties:
        event-id:
          type: string
          format: uuid
          description: Stable immutable message identifier reused for every delivery retry.
        correlation-id:
          type: string
          minLength: 1
          description: End-to-end workflow correlation identifier propagated unchanged.
        causation-id:
          type: string
          minLength: 1
          description: Initiating command id or directly preceding eventId that caused this message.
        producer:
          type: string
          enum:
            - account-service
            - transaction-service
          description: Canonical name of the channel's sole producer.
        schema-version:
          type: string
          const: 1.0.0
          description: Registered payload schema version.
        occurred-at:
          type: string
          format: date-time
          description: UTC timestamp at which the command was created or business fact occurred.
    WorkflowMessageEnvelope:
      type: object
      description: Common identity, ownership, timing, and workflow correlation fields.
      additionalProperties: true
      required:
        - eventId
        - eventType
        - schemaVersion
        - producer
        - occurredAt
        - aggregateId
        - correlationId
        - causationId
        - transactionId
        - reservationRequestId
      properties:
        eventId:
          type: string
          format: uuid
          description: Unique immutable identifier for this command or event instance.
        eventType:
          type: string
          minLength: 1
          description: Versioned command or event name declared by the concrete message schema.
        schemaVersion:
          type: string
          const: 1.0.0
          description: Semantic version of the registered v1 payload schema.
        producer:
          type: string
          enum:
            - account-service
            - transaction-service
          description: Canonical service name of the sole producer.
        occurredAt:
          type: string
          format: date-time
          description: UTC timestamp at which the command was created or business fact occurred.
        aggregateId:
          type: string
          minLength: 1
          description: reservationRequestId for reservation messages and transactionId for transfer outcomes.
        correlationId:
          type: string
          minLength: 1
          description: End-to-end workflow identifier propagated unchanged.
        causationId:
          type: string
          minLength: 1
          description: Initiating command id or directly preceding eventId that caused this message.
        transactionId:
          type: string
          format: uuid
          description: Transfer workflow identifier owned by Transaction Service.
        reservationRequestId:
          type: string
          minLength: 1
          description: Cross-service reservation idempotency key generated by Transaction Service.
    AccountReservationRequestedV1:
      allOf:
        - $ref: '#/components/schemas/WorkflowMessageEnvelope'
        - type: object
          additionalProperties: true
          required:
            - sourceAccountId
            - destinationAccountId
            - amount
            - currency
            - expiresAt
          properties:
            eventType:
              type: string
              const: AccountReservationRequested.v1
            schemaVersion:
              type: string
              const: 1.0.0
            producer:
              type: string
              const: transaction-service
            sourceAccountId:
              $ref: '#/components/schemas/AccountId'
            destinationAccountId:
              $ref: '#/components/schemas/AccountId'
            amount:
              $ref: '#/components/schemas/PositiveDecimalAmount'
            currency:
              $ref: '#/components/schemas/Currency'
            expiresAt:
              type: string
              format: date-time
              description: UTC deadline after which an ACTIVE reservation may expire.
    AccountReservationReleaseRequestedV1:
      allOf:
        - $ref: '#/components/schemas/WorkflowMessageEnvelope'
        - type: object
          additionalProperties: true
          required:
            - reservationId
            - sourceAccountId
            - reason
          properties:
            eventType:
              type: string
              const: AccountReservationReleaseRequested.v1
            schemaVersion:
              type: string
              const: 1.0.0
            producer:
              type: string
              const: transaction-service
            reservationId:
              type: string
              format: uuid
              description: Account Service reservation identifier received in the accepted event.
            sourceAccountId:
              $ref: '#/components/schemas/AccountId'
            reason:
              type: string
              enum:
                - TRANSFER_CANCELED
                - TRANSFER_TIMEOUT
                - MANUAL_COMPENSATION
              description: Stable reason Transaction Service requires compensation.
            postingRequestId:
              type: string
              minLength: 1
              description: Ledger request idempotency key when compensation follows posting failure.
    AccountReservationAcceptedV1:
      allOf:
        - $ref: '#/components/schemas/WorkflowMessageEnvelope'
        - type: object
          additionalProperties: true
          required:
            - reservationId
            - sourceAccountId
            - destinationAccountId
            - amount
            - currency
            - expiresAt
            - status
          properties:
            eventType:
              type: string
              const: AccountReservationAccepted.v1
            schemaVersion:
              type: string
              const: 1.0.0
            producer:
              type: string
              const: account-service
            reservationId:
              type: string
              format: uuid
              description: Stable Account Service reservation identifier.
            sourceAccountId:
              $ref: '#/components/schemas/AccountId'
            destinationAccountId:
              $ref: '#/components/schemas/AccountId'
            amount:
              $ref: '#/components/schemas/PositiveDecimalAmount'
            currency:
              $ref: '#/components/schemas/Currency'
            expiresAt:
              type: string
              format: date-time
            status:
              type: string
              const: ACTIVE
    AccountReservationRejectedV1:
      allOf:
        - $ref: '#/components/schemas/WorkflowMessageEnvelope'
        - type: object
          additionalProperties: true
          required:
            - sourceAccountId
            - destinationAccountId
            - amount
            - currency
            - rejectionCode
            - rejectionReason
          properties:
            eventType:
              type: string
              const: AccountReservationRejected.v1
            schemaVersion:
              type: string
              const: 1.0.0
            producer:
              type: string
              const: account-service
            sourceAccountId:
              $ref: '#/components/schemas/AccountId'
            destinationAccountId:
              $ref: '#/components/schemas/AccountId'
            amount:
              $ref: '#/components/schemas/PositiveDecimalAmount'
            currency:
              $ref: '#/components/schemas/Currency'
            rejectionCode:
              type: string
              enum:
                - ACCOUNT_NOT_FOUND
                - ACCOUNT_NOT_ACTIVE
                - CURRENCY_MISMATCH
                - INSUFFICIENT_AVAILABLE_BALANCE
                - VALIDATION_ERROR
                - CONFLICT
              description: Stable machine-readable business rejection.
            rejectionReason:
              $ref: '#/components/schemas/SanitizedReason'
    AccountReservationReleasedV1:
      allOf:
        - $ref: '#/components/schemas/WorkflowMessageEnvelope'
        - type: object
          additionalProperties: true
          required:
            - reservationId
            - sourceAccountId
            - amount
            - currency
            - releaseReason
            - status
          properties:
            eventType:
              type: string
              const: AccountReservationReleased.v1
            schemaVersion:
              type: string
              const: 1.0.0
            producer:
              type: string
              const: account-service
            reservationId:
              type: string
              format: uuid
            sourceAccountId:
              $ref: '#/components/schemas/AccountId'
            amount:
              $ref: '#/components/schemas/PositiveDecimalAmount'
            currency:
              $ref: '#/components/schemas/Currency'
            releaseReason:
              type: string
              enum:
                - LEDGER_POSTING_FAILED
                - TRANSFER_CANCELED
                - TRANSFER_TIMEOUT
                - MANUAL_COMPENSATION
              description: Stable reason the held amount was released.
            postingRequestId:
              type: string
              minLength: 1
            status:
              type: string
              const: RELEASED
    AccountReservationExpiredV1:
      allOf:
        - $ref: '#/components/schemas/WorkflowMessageEnvelope'
        - type: object
          additionalProperties: true
          required:
            - reservationId
            - sourceAccountId
            - amount
            - currency
            - expiresAt
            - status
          properties:
            eventType:
              type: string
              const: AccountReservationExpired.v1
            schemaVersion:
              type: string
              const: 1.0.0
            producer:
              type: string
              const: account-service
            reservationId:
              type: string
              format: uuid
            sourceAccountId:
              $ref: '#/components/schemas/AccountId'
            amount:
              $ref: '#/components/schemas/PositiveDecimalAmount'
            currency:
              $ref: '#/components/schemas/Currency'
            expiresAt:
              type: string
              format: date-time
              description: UTC deadline that caused this durable expiry.
            status:
              type: string
              const: EXPIRED
    TransferCreatedV1:
      allOf:
        - $ref: '#/components/schemas/WorkflowMessageEnvelope'
        - type: object
          additionalProperties: true
          required:
            - sourceAccountId
            - destinationAccountId
            - amount
            - currency
            - transferRequestId
            - postingRequestId
            - status
          properties:
            eventType:
              type: string
              const: TransferCreated.v1
            schemaVersion:
              type: string
              const: 1.0.0
            producer:
              type: string
              const: transaction-service
            sourceAccountId:
              $ref: '#/components/schemas/AccountId'
            destinationAccountId:
              $ref: '#/components/schemas/AccountId'
            amount:
              $ref: '#/components/schemas/PositiveDecimalAmount'
            currency:
              $ref: '#/components/schemas/Currency'
            transferRequestId:
              type: string
              minLength: 1
              description: Client request idempotency key owned by Transaction Service.
            postingRequestId:
              type: string
              minLength: 1
              description: Ledger posting idempotency key reserved for this workflow.
            status:
              type: string
              const: PENDING
    TransferCompletedV1:
      allOf:
        - $ref: '#/components/schemas/WorkflowMessageEnvelope'
        - type: object
          additionalProperties: true
          required:
            - reservationId
            - postingRequestId
            - postingId
            - sourceAccountId
            - destinationAccountId
            - amount
            - currency
            - status
          properties:
            eventType:
              type: string
              const: TransferCompleted.v1
            schemaVersion:
              type: string
              const: 1.0.0
            producer:
              type: string
              const: transaction-service
            reservationId:
              type: string
              format: uuid
            postingRequestId:
              type: string
              minLength: 1
              description: Ledger posting idempotency key.
            postingId:
              type: string
              format: uuid
              description: Immutable posting identifier from LedgerPostingCompleted.v1.
            sourceAccountId:
              $ref: '#/components/schemas/AccountId'
            destinationAccountId:
              $ref: '#/components/schemas/AccountId'
            amount:
              $ref: '#/components/schemas/PositiveDecimalAmount'
            currency:
              $ref: '#/components/schemas/Currency'
            status:
              type: string
              const: COMPLETED
    TransferFailedV1:
      allOf:
        - $ref: '#/components/schemas/WorkflowMessageEnvelope'
        - type: object
          additionalProperties: true
          required:
            - sourceAccountId
            - destinationAccountId
            - amount
            - currency
            - status
            - failureStage
            - failureCode
            - failureReason
            - compensationStatus
            - manualReviewRequired
          properties:
            eventType:
              type: string
              const: TransferFailed.v1
            schemaVersion:
              type: string
              const: 1.0.0
            producer:
              type: string
              const: transaction-service
            reservationId:
              type: string
              format: uuid
              description: Present when Account Service created a reservation.
            postingRequestId:
              type: string
              minLength: 1
              description: Present when Transaction Service requested ledger posting.
            postingId:
              type: string
              format: uuid
              description: Present only when an immutable posting exists.
            sourceAccountId:
              $ref: '#/components/schemas/AccountId'
            destinationAccountId:
              $ref: '#/components/schemas/AccountId'
            amount:
              $ref: '#/components/schemas/PositiveDecimalAmount'
            currency:
              $ref: '#/components/schemas/Currency'
            status:
              type: string
              const: FAILED
            failureStage:
              type: string
              enum:
                - RESERVATION
                - LEDGER_POSTING
                - RESERVATION_RELEASE
                - WORKFLOW_TIMEOUT
              description: Workflow stage that established terminal failure.
            failureCode:
              type: string
              enum:
                - RESERVATION_REJECTED
                - RESERVATION_EXPIRED
                - LEDGER_POSTING_FAILED
                - RESERVATION_RELEASE_FAILED
                - WORKFLOW_TIMED_OUT
                - WORKFLOW_CONFLICT
              description: Stable machine-readable transfer failure classification.
            failureReason:
              $ref: '#/components/schemas/SanitizedReason'
            compensationStatus:
              type: string
              enum:
                - NOT_REQUIRED
                - COMPLETED
                - FAILED
              description: Final compensation state; PENDING is forbidden on this terminal event.
            manualReviewRequired:
              type: boolean
              description: Must be true when compensationStatus is FAILED or a contradictory terminal outcome was quarantined.
        - if:
            properties:
              compensationStatus:
                const: FAILED
          then:
            properties:
              manualReviewRequired:
                const: true
    AccountId:
      type: string
      format: uuid
      description: Opaque account identifier; never an account number or customer PII.
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO 4217 alphabetic currency code.
    PositiveDecimalAmount:
      type: string
      pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]{1,4})?$'
      not:
        enum:
          - '0'
          - '0.0'
          - '0.00'
          - '0.000'
          - '0.0000'
      description: Decimal amount encoded as a string, at least 0.0001, with no more than four fractional digits.
    SanitizedReason:
      type: string
      minLength: 1
      maxLength: 500
      description: Human-readable detail without secrets, PII, account numbers, stack traces, or internal implementation data.
