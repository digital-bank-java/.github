name: Validate AsyncAPI contracts

on:
  pull_request:
    paths:
      - "docs/contracts/**"
      - "scripts/validate_asyncapi_contracts.rb"
      - ".github/workflows/validate-asyncapi-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "docs/contracts/**"
      - "scripts/validate_asyncapi_contracts.rb"
      - ".github/workflows/validate-asyncapi-contracts.yml"

permissions:
  contents: read

jobs:
  validate:
    name: AsyncAPI contract validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate contracts
        run: ruby scripts/validate_asyncapi_contracts.rb
