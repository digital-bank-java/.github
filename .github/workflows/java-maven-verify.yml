name: Reusable Java Maven Verify

on:
  workflow_call:
    inputs:
      working_directory:
        description: Repository directory that contains mvnw and pom.xml.
        required: false
        default: .
        type: string
      java_version:
        description: Java major version used by the Maven Wrapper.
        required: false
        default: "21"
        type: string
      test_report_artifact_name:
        description: Name for the uploaded Surefire and Failsafe test-report artifact.
        required: false
        default: maven-test-reports
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven
          cache-dependency-path: ${{ inputs.working_directory }}/pom.xml

      - name: Run Maven verify
        working-directory: ${{ inputs.working_directory }}
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload Maven test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.test_report_artifact_name }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ inputs.working_directory }}/target/surefire-reports/**
            ${{ inputs.working_directory }}/target/failsafe-reports/**
