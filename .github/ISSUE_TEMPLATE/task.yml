name: Task
description: Define a specific, bounded piece of engineering work.
title: "TASK: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for implementation, documentation, maintenance, or operational tasks. Do not include credentials, tokens, private endpoints, or customer data.
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the concrete work to complete.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List affected repositories, components, and exclusions.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List verifiable completion conditions.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and Rollout Notes
      description: List parent story, related issues, merge order, or deployment considerations. Write None when there are no dependencies.
    validations:
      required: true
